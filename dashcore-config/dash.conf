testnet=1
server=1
txindex=1

[test]
rpcuser=dashrpc
# rpcpassword is passed on the command line from DASH_RPC_PASSWORD (see
# docker-compose.yml) so no shared default ever reaches a deployment.
# RPC is reachable from container networks only, never the internet.
rpcallowip=127.0.0.1
rpcallowip=10.0.0.0/8
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
rpcbind=0.0.0.0
